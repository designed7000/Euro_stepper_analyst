[project]
name = "euro-stepper-analyst"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "streamlit>=1.28.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "plotly>=5.18.0",
    "nba-api>=1.4.1",
    "scikit-learn>=1.3.0",
    "pyarrow>=14.0.0",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]