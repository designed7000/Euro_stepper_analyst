version: 2

sources:
  - name: raw
    description: Immutable Parquet files written by `esa load`. All source columns are strings.
    meta:
      external_location: "read_parquet('{{ env_var('ESA_RAW_DIR') }}/{name}/*/*/*.parquet', union_by_name = true)"
    tables:
      - name: nba_shots
      - name: nba_player_index
      - name: nba_game_log
